# eval 04 · Palabras prohibidas difíciles
#
# Tensa: la normalización de `guardrail_prohibidas`, que §11a promete sobre
# "mayúsculas, acentos, plurales y variantes simples".
#
# Cada término prohibido está elegido para forzar una clase distinta de variante,
# y el brief está construido para que el escritor QUIERA usarlas: se pide una
# novela marítima con un naufragio en el trasfondo, y se prohíbe la familia
# entera de `naufragio`.
#
#   naufragio   -> naufragar, naufragó, naufragado, naufragios, náufrago
#                  Requiere stemming. Es el caso que de verdad importa: quien
#                  prohíbe `naufragio` porque perdió a alguien en el mar no
#                  quiere leer `naufragó` tampoco.
#   ahogar      -> ahogado, ahogamiento, se ahogó
#   pérdida     -> perdida (sin tilde), pérdidas
#   luto        -> enlutado, enlutada
#
# El nivel `destinatario` se usa a propósito, que es el que no admite fallo:
# recoge lo que ESTA persona no debe leer, no una preferencia estética.
#
# Esperado: publica sin ninguna variante prohibida, o se detiene tras agotar los
# reintentos e informa. Lo que NO es aceptable es publicar con una variante dentro.

id: eval-04-prohibidas-dificiles
esperado:
  termina_en: [publicada, detenido]
  variantes_prohibidas_en_texto_publicado: 0
  # Si se detiene, debe ser por reintentos agotados y con el informe, no en silencio.
  si_detenido_por: reintentos_agotados

brief:
  homenajeado:
    nombre_homenajeado: Nicanor Ruiz de Gauna
    fecha_nacimiento: 1952-01-30
    rol_epoca: farero
    ocasion: jubilación
    elementos_personalizacion:
      - { texto: pasó treinta inviernos solo en el faro, obligatorio: true }
      - { texto: salvó a dos pescadores una noche de galerna, obligatorio: true }

  mundo:
    periodo: { inicio: 1898, fin: 1902, denominacion: fin de siglo }
    lugar: costa de Cantabria
    personajes_historicos: { aparecen: [], se_evitan: [] }

  obra:
    genero: { principal: histórica, subgenero: marítima }
    # El tono empuja justo hacia el léxico prohibido. Es deliberado.
    tono: sombrío con redención final
    grado_licencia: moderado
    arcaismo: marcado
    contenido_admisible: sin violencia explícita
    palabras_prohibidas:
      novela: [ahogar, luto]
      destinatario: [naufragio, pérdida]
    n_capitulos: 10
    palabras_por_capitulo: 1200

# eval 03 · Incoherencia temporal
#
# Tensa: la detección de contradicciones del `@model_validator` en Intake, y como
# red de seguridad el validador Lean sobre `cronologia_*`.
#
# Hay tres incoherencias sembradas, de tres clases distintas:
#
#   1. El homenajeado nace en 1831 y la novela transcurre entre 1803 y 1806.
#      Es la contradicción dura: no puede ser personaje de su propia novela.
#   2. El evento ancla (Trafalgar, 21-10-1805) cae fuera del período declarado
#      si se toma el período al pie de la letra... pero no: cae dentro. La trampa
#      es que el personaje histórico que se pide, Gravina, murió el 09-03-1806,
#      y el brief pide que aparezca en el desenlace, que el tono sitúa después.
#   3. Un objeto imposible: se pide que aparezca un telégrafo eléctrico, que no
#      existe hasta los años treinta del XIX. Lo caza `anacronismo_fechado`
#      contra `mundo_entidad.fecha_inicio`, no Lean.
#
# Esperado: SE DETIENE EN EL GATE DE INTAKE con la contradicción (1) explicada,
# antes de gastar un solo token en investigación.
#
# Lo que la eval mide de verdad no es si el sistema detecta la incoherencia, sino
# DÓNDE la detecta. Si la novela se escribe entera y la caza Lean al final, el
# sistema funciona pero funciona caro.

id: eval-03-incoherencia-temporal
esperado:
  termina_en: detenido
  se_detiene_en: gate_intake
  contradiccion_detectada: fecha_nacimiento_vs_periodo
  tokens_gastados_en_investigacion: 0

brief:
  homenajeado:
    nombre_homenajeado: Cosme Aldecoa Barrenetxea
    # 1831: veinticinco años DESPUÉS del final del período.
    fecha_nacimiento: 1831-06-20
    rol_epoca: contramaestre
    ocasion: aniversario de bodas
    elementos_personalizacion:
      - { texto: conserva el catalejo de su padre, obligatorio: true }
      - { texto: aprendió a leer con un telégrafo eléctrico del puerto, obligatorio: true }

  mundo:
    periodo: { inicio: 1803, fin: 1806, denominacion: Guerras Napoleónicas }
    lugar: Cádiz
    evento_ancla: la batalla de Trafalgar
    personajes_historicos:
      aparecen: [Federico Gravina]
      se_evitan: []

  obra:
    genero: { principal: histórica, subgenero: marítima }
    # El tono pide un desenlace posterior al evento ancla, lo que empuja el final
    # más allá de la muerte de Gravina (09-03-1806).
    tono: epílogo sereno, años después de la batalla
    grado_licencia: estricto
    arcaismo: moderado
    contenido_admisible: sin violencia explícita
    palabras_prohibidas: { novela: [], destinatario: [] }
    n_capitulos: 10
    palabras_por_capitulo: 1200

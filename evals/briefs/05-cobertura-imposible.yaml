# eval 05 · Cobertura imposible
#
# Tensa: los tres validadores de cobertura, y sobre todo el ORDEN en que actúan.
#
# Hay 24 elementos de personalización, los 24 obligatorios, para una novela de 4
# capítulos de 1.000 palabras. Son seis elementos obligatorios por capítulo en
# mil palabras, con un arco, un conflicto y un escenario histórico que sostener.
# No cabe, y no se espera que quepa.
#
# Lo que se mide es DÓNDE se entera el sistema:
#
#   Bien:  `cobertura_anclada` lo detecta en el gate de Plotting, porque algún
#          elemento obligatorio se queda sin escena a la que anclarse. Cuesta un
#          SELECT y una escaleta.
#   Mal:   nadie lo detecta hasta `cobertura_personalizacion`, en el gate de
#          Writing. Cuesta cuatro capítulos escritos y pagados.
#   Peor:  el arquitecto "resuelve" el problema amontonando elementos en una
#          escena para que el anclaje pase, y el fallo aparece en
#          `cobertura_capitulo` al escribir. Esto también es un resultado y hay
#          que anotarlo: significa que anclar es demasiado barato.
#
# La distancia entre el primer caso y los otros dos es una propiedad del DISEÑO,
# no de la calidad de la prosa. Por eso este brief es el más útil de los cinco.
#
# Nota sobre `n_capitulos: 4`: está por debajo del valor por defecto a propósito,
# para que la imposibilidad sea aritmética y no discutible.

id: eval-05-cobertura-imposible
esperado:
  termina_en: detenido
  se_detiene_en: gate_plotting
  validador_que_lo_detecta: cobertura_anclada
  capitulos_escritos: 0

brief:
  homenajeado:
    nombre_homenajeado: Purificación Ostolaza Mendizábal
    fecha_nacimiento: 1944-07-08
    rol_epoca: maestra de escuela
    ocasion: noventa cumpleaños
    elementos_personalizacion:
      - { texto: nació en un caserío sin luz eléctrica, obligatorio: true }
      - { texto: caminaba cinco kilómetros hasta la escuela, obligatorio: true }
      - { texto: su madre cosía para el pueblo entero, obligatorio: true }
      - { texto: aprendió francés con una vecina exiliada, obligatorio: true }
      - { texto: le regalaron un reloj de bolsillo a los quince, obligatorio: true }
      - { texto: tocaba el acordeón en las fiestas, obligatorio: true }
      - { texto: perdió a un hermano muy joven, obligatorio: true }
      - { texto: guardaba las cartas en una lata de galletas, obligatorio: true }
      - { texto: plantó un nogal el día de su boda, obligatorio: true }
      - { texto: enseñó a leer a doscientos niños, obligatorio: true }
      - { texto: nunca aprendió a conducir, obligatorio: true }
      - { texto: hacía pan los sábados, obligatorio: true }
      - { texto: coleccionaba dedales, obligatorio: true }
      - { texto: se rompió la muñeca patinando a los sesenta, obligatorio: true }
      - { texto: su marido le escribía coplas, obligatorio: true }
      - { texto: bordó el mantel del altar del pueblo, obligatorio: true }
      - { texto: tenía miedo a los truenos, obligatorio: true }
      - { texto: cantaba en el coro de la parroquia, obligatorio: true }
      - { texto: criaba gallinas con nombre propio, obligatorio: true }
      - { texto: no probó el mar hasta los cuarenta, obligatorio: true }
      - { texto: escribía el diario en euskera, obligatorio: true }
      - { texto: conservaba el primer cuaderno de sus alumnos, obligatorio: true }
      - { texto: le decían Puri la del nogal, obligatorio: true }
      - { texto: se negó a jubilarse dos veces, obligatorio: true }

  mundo:
    periodo: { inicio: 1890, fin: 1898, denominacion: Restauración borbónica }
    lugar: valle del Urola
    personajes_historicos: { aparecen: [], se_evitan: [] }

  obra:
    genero: { principal: histórica, subgenero: costumbrista }
    tono: luminoso
    grado_licencia: amplio
    arcaismo: mínimo
    contenido_admisible: sin violencia explícita
    palabras_prohibidas: { novela: [], destinatario: [] }
    # Cuatro capítulos de mil palabras para veinticuatro elementos obligatorios.
    n_capitulos: 4
    palabras_por_capitulo: 1000

\* Modelo pequeño para TLC: 5 capítulos, 2 reintentos, gates activos.
\*
\* Pequeño a propósito. Lo que se verifica aquí no depende del tamaño —que Repair
\* tenga dos aristas de entrada compartiendo un contador se ve igual con cinco
\* capítulos que con diez— y el espacio de estados crece deprisa con NCapitulos.
\*
\* Para el modo batch, cambiar GatesActivos a FALSE: la liveness pasa entonces a
\* valer sin hipótesis de equidad sobre la respuesta del Autor, porque no hay
\* Autor al que esperar.

SPECIFICATION Spec

CONSTANTS
    NCapitulos  = 5
    MaxIntentos = 2
    GatesActivos = TRUE
    MaxRechazosJuez = 2

INVARIANTS
    TypeOK
    NoPublishUnvalidated
    ResumeIsExactlyOnce
    RetriesBounded
    CorpusSelladoNoSeToca

PROPERTIES
    PreviousVersionPreserved
    Termina

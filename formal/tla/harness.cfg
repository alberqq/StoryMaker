\* Modelo pequeño para TLC: 5 capítulos, 2 reintentos, gates activos, una caída
\* del proceso, un reintento manual y un cambio del lector.
\*
\* Pequeño a propósito. Lo que se verifica aquí no depende del tamaño —que Repair
\* tenga dos aristas de entrada compartiendo un contador se ve igual con cinco
\* capítulos que con diez— y el espacio de estados crece deprisa con NCapitulos.
\*
\* Las cotas del entorno (caídas, reintentos manuales, cambios del lector) son
\* las que hacen finito el espacio: sin la del lector, `versiones` crece con cada
\* regeneración y TLC no agota nunca los estados.
\*
\* El modo batch está en harness_batch.cfg.

SPECIFICATION Spec

CONSTANTS
    NCapitulos       = 5
    MaxIntentos      = 2
    GatesActivos     = TRUE
    MaxRechazosJuez  = 2
    MaxCaidas        = 1
    MaxReintentos    = 1
    MaxCambiosLector = 1

INVARIANTS
    TypeOK
    NoPublishUnvalidated
    ResumeIsExactlyOnce
    RetriesBounded
    CorpusSelladoNoSeToca

PROPERTIES
    PreviousVersionPreserved
    Termina

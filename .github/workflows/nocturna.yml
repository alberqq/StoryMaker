# spec: §7.1 · verif. §3.3, §3.7, §6 — Puerta G2: nocturna, **no bloquea**.
#
# Todo lo que corre aquí tarda lo que se le deje tardar, y por eso no está en G1: la
# ejecución simbólica explora sin techo y la mutación vuelve a correr la suite una vez por
# cada mutante. Poner esto por *commit* haría que nadie integrase.
#
# **Ningún paso falla la ejecución**, que es lo que `verification.md` declara de G2: un
# hallazgo abre defecto y se trata en el hito, no detiene el trabajo de nadie. Lo que sí hace
# es dejar el número escrito en el informe, para que la conversación sobre el hito empiece
# con un dato en lugar de con una impresión.
#
# **Lo que no está aquí y podría parecer que debería.** Las evaluaciones sobre los cinco
# briefs y la varianza del juez son también G2 nocturna, y no corren en este runner: los
# nueve roles hablan con el modelo a través del Claude Agent SDK, que hereda la sesión de
# Claude Code, y una máquina de GitHub no tiene esa sesión. No hay credencial de Anthropic
# en este repositorio ni la va a haber. Esas dos se lanzan a mano, con `evals/correr.py` y
# `evals/varianza_juez.py`, desde una máquina autenticada.
name: G2

on:
  schedule:
    # 03:15 UTC, que en el huso del Autor es de madrugada y el runner está descongestionado.
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  mutacion:
    name: Mutacion sobre el Core Domain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: cd backend && uv sync --frozen --group dev --group ci
      - name: mutmut run
        continue-on-error: true
        # El alcance está en `[tool.mutmut]` de `pyproject.toml` y no aquí, para que correrlo
        # en local y correrlo en CI midan exactamente lo mismo.
        run: cd backend && uv run --group ci mutmut run
      - name: Resultados
        if: always()
        continue-on-error: true
        run: cd backend && uv run --group ci mutmut results
      - name: Objetivo declarado
        if: always()
        run: echo "verif. §3.7 fija el objetivo en mutation score >= 80 % sobre commons/validation/."

  simbolica:
    name: CrossHair sobre las cinco funciones puras
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: cd backend && uv sync --frozen --group dev --group ci
      - name: Core Domain
        continue-on-error: true
        # `puras.py` tiene tres de las cinco: `normalizar`, `es_anacronico`,
        # `hay_solape_temporal`, más `capitulos_afectados`. El timeout por condición acota lo
        # que si no sería una exploración sin final.
        run: |
          cd backend
          uv run --group ci crosshair check \
            --per_condition_timeout=30 \
            storymaker.commons.validation.puras
      - name: Truncado del paquete de contexto
        continue-on-error: true
        # La quinta: `truncar_por_prioridad`, que es la que sostiene el techo de 12.000
        # tokens del paquete por construcción y no por medición.
        run: |
          cd backend
          uv run --group ci crosshair check \
            --per_condition_timeout=30 \
            storymaker.commons.context.truncado
      - name: Que se hace con un contraejemplo
        if: always()
        run: echo "verif. §3.3: un contraejemplo hallado se convierte en caso de prueba y ya no se pierde."

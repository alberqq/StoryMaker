# spec: §7.1 · verif. §6 — Puerta G1: no se integra nada que no pase esto.
name: G1

on:
  push:
    branches: [zero]
  pull_request:

jobs:
  estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Entorno reproducible
        run: cd backend && uv sync --frozen --group dev
      - name: ruff y bandit
        run: cd backend && uv run ruff check .
      - name: mypy --strict
        run: cd backend && uv run mypy

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: cd backend && uv sync --frozen --group dev
      - name: pytest
        run: cd backend && uv run pytest -q

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reglas Semgrep del arnes
        run: cd backend && uv run --group ci semgrep scan --config ../semgrep --error ..
      - name: pip-audit sobre uv.lock
        run: cd backend && uv run --group ci pip-audit --strict

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java para TLC
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: tla2tools
        run: curl -sSLo tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
      - name: TLC sobre el modelo pequeno
        # No ejecuta el codigo: explora exhaustivamente los estados alcanzables del modelo
        # y, si encuentra una violacion, devuelve el contraejemplo. Corre en desarrollo, no
        # en cada generacion.
        run: java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -config formal/tla/harness.cfg formal/tla/harness.tla

  # IMP-04 e IMP-28. Las pruebas y la construcción bloquean, como el resto de G1; Steiger
  # informa y no bloquea (spec del frontend §8): la forma de una carpeta no pone en riesgo lo
  # que G3 y G5 protegen, y el cliente único —que sí lo pone— lo comprueba una prueba.
  frontend-estructura:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc y construcción
        run: npm run build
      - name: Pruebas de pantalla y de estructura (MSW)
        run: npm test
      - name: Steiger (informa)
        continue-on-error: true
        run: npx steiger ./src | tee steiger.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-steiger
          path: frontend/steiger.txt
